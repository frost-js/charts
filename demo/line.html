<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frost Chart</title>
    <link rel="stylesheet" href="../node_modules/@fr0st/ui/dist/frost-ui.css">
    <script src="../node_modules/@fr0st/ui/dist/frost-ui-bundle.js"></script>
    <script src="../dist/frost-charts.js"></script>
</head>

<body>
    <nav class="p-3"><a href="index.html">All chart demos</a></nav>
    <div id="chart" style="height: 500px;"></div>
    <script>
        const chart = document.getElementById('chart');

        new UI.Chart(chart, {
            type: 'line',
            data: {
                labels: ['A', 'B', 'C', 'D', 'E'],
                datasets: [
                    {
                        label: 'D1',
                        data: [20, 5, 50, 90, 13],
                        borderColor: 'blue'
                    },
                    {
                        label: 'D2',
                        data: [24, 81, 33, 7, 0],
                        borderColor: 'red'
                    }
                ]
            }
        });
    </script>
</body>

</html>
